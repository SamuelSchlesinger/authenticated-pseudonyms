[package]
name = "private-proofs-crypto"
version = "0.3.2"
edition = "2021"
repository = "https://github.com/SamuelSchlesinger/authenticated-pseudonyms"
license = "Apache-2.0"
keywords = ["cryptography", "credentials", "anonymous", "pseudonym", "authentication"]
description = "An implementation of anonymous credentials"
readme = "README.md"

[dependencies]
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["ff", "group", "digest"] }
num = { version = "0.4.3" }
group = "0.13.0"
subtle = "2.6.1"
digest = { version = "0.10.7", features = ["subtle"] }
generic-array = "1.2.0"

[[bench]]
name = "performance"
harness = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
sha2 = "0.10.8"
